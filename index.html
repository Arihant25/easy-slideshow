<style>
:root{
  --bg:#1c1c1c;          /* window chrome (Mica-ish dark) */
  --stage:#000;          /* photo backdrop */
  --fg:#ffffff;
  --muted:#c9c9c9;
  --hover:rgba(255,255,255,.08);
  --active:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.09);
  --accent:#4cc2ff;      /* Win11 accent (light-on-dark) */
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px}
button,input{font:inherit;color:inherit}
svg{display:block}

/* ---------- Drop / home screen ---------- */
#drop{position:fixed;inset:0;display:grid;place-items:center;padding:24px}
.drop-card{width:min(560px,100%);padding:52px 36px;text-align:center;border:1px solid var(--line);
  border-radius:12px;background:#252525;box-shadow:0 24px 70px #000a}
.drop-card h1{margin:0 0 10px;font-size:26px;font-weight:600}
.drop-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.drop-card .hint{margin-top:26px;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;
  border:1px solid var(--accent);border-radius:6px;color:#fff;background:rgba(76,194,255,.12)}
#drop.over .drop-card{border-color:var(--accent);background:#2b2b2b}

/* ---------- App shell ---------- */
#app{position:fixed;inset:0;display:none;grid-template-rows:48px 1fr auto;background:var(--stage)}

/* ---------- Title bar ---------- */
#titlebar{position:relative;height:48px;display:flex;align-items:center;background:var(--bg);
  border-bottom:1px solid var(--line);-webkit-app-region:drag}
.tb-left{display:flex;align-items:center;gap:2px;padding-left:8px;z-index:2}
.tb-right{display:flex;align-items:stretch;margin-left:auto;height:100%;z-index:2}
.tb-title{position:absolute;left:50%;top:0;height:48px;transform:translateX(-50%);
  display:flex;align-items:center;max-width:38vw;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;color:#f3f3f3;font-size:13px;pointer-events:none}

.tb-btn{-webkit-app-region:no-drag;display:inline-flex;align-items:center;gap:8px;height:34px;
  padding:0 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:#f3f3f3}
.tb-btn:hover{background:var(--hover)}
.tb-btn:active{background:var(--active)}
.tb-btn.icon{width:36px;padding:0;justify-content:center}
.tb-btn.edit{padding:0 14px 0 12px;background:var(--hover)}
.tb-btn.edit:hover{background:var(--active)}
.tb-btn.openwith{margin:7px 6px;padding:0 12px;background:var(--hover);border:1px solid var(--line)}
.tb-btn.openwith:hover{background:var(--active)}

.caption{display:flex;align-items:stretch;height:100%;-webkit-app-region:no-drag}
.caption button{width:46px;height:100%;border:0;background:transparent;color:#f3f3f3;cursor:pointer;
  display:grid;place-items:center}
.caption button:hover{background:var(--hover)}
.caption .close:hover{background:#c42b1c;color:#fff}

/* ---------- Stage ---------- */
#stage{position:relative;overflow:hidden;background:var(--stage);display:grid;place-items:center}
#image{max-width:100%;max-height:100%;object-fit:contain;user-select:none;transform-origin:center center;
  transition:transform .12s ease}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:76px;border:0;cursor:pointer;
  display:grid;place-items:center;color:#fff;border-radius:8px;
  background:rgba(30,30,30,.55);backdrop-filter:blur(6px);opacity:0;transition:opacity .15s}
#stage:hover .nav{opacity:1}
.nav:hover{background:rgba(50,50,50,.8)}
.nav.prev{left:10px}
.nav.next{right:10px}

/* ---------- Filmstrip (thumbnails) ---------- */
#strip{position:absolute;left:0;right:0;bottom:56px;display:none;justify-content:safe center;gap:8px;
  padding:0 16px;overflow-x:auto;overflow-y:hidden;z-index:3;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
#app.no-strip #strip{display:none!important}
.thumb{height:54px;width:92px;object-fit:cover;border-radius:4px;cursor:pointer;flex:none;
  opacity:.9;border:1px solid rgba(255,255,255,.12);transition:opacity .12s}
.thumb:hover{opacity:1}
.thumb.current{opacity:1;border-color:transparent;outline:2px solid #fff;outline-offset:2px;border-radius:5px}

/* ---------- Status bar ---------- */
#statusbar{position:relative;z-index:4;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  height:44px;padding:0 8px;background:var(--bg);border-top:1px solid var(--line)}
.sb-group{display:flex;align-items:center;gap:2px}
.sb-left{justify-self:start}
.sb-center{justify-self:center}
.sb-right{justify-self:end}
.sb-btn{-webkit-app-region:no-drag;width:34px;height:34px;border:0;background:transparent;border-radius:6px;
  cursor:pointer;display:grid;place-items:center;color:#f3f3f3}
.sb-btn:hover{background:var(--hover)}
.sb-btn:active{background:var(--active)}

#durationText{display:inline-flex;align-items:center;gap:6px;min-width:78px;justify-content:center;
  height:32px;padding:0 8px;border-radius:6px;color:#e9e9e9;font-size:13px;cursor:pointer}
#durationText:hover{background:var(--hover)}
#durationInput{width:72px;height:30px;display:none;background:#2b2b2b;border:1px solid #666;border-radius:6px;
  color:#fff;text-align:center;padding:0 6px;margin:0 2px}

/* Win11-style range slider (repurposed as slideshow speed) */
#duration{-webkit-appearance:none;appearance:none;width:120px;height:24px;background:transparent;cursor:pointer;margin:0 2px}
#duration::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
#duration::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
#duration::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin-top:-5.5px;
  border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.25);box-shadow:0 0 0 3px rgba(0,0,0,.001)}
#duration::-moz-range-thumb{width:14px;height:14px;border:1px solid rgba(0,0,0,.25);border-radius:50%;background:#fff}
#duration:hover::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(255,255,255,.15)}

/* ---------- Countdown ---------- */
#countdown{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:20}
.cd-ring{position:relative;width:170px;height:170px;display:grid;place-items:center;border-radius:50%;
  background:rgba(20,20,20,.4);backdrop-filter:blur(16px);
  box-shadow:0 16px 60px #000b, inset 0 0 0 1px rgba(255,255,255,.08);animation:cd-in .35s ease-out}
.cd-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.cd-track{fill:none;stroke:rgba(255,255,255,.14);stroke-width:4}
.cd-prog{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:295;
  filter:drop-shadow(0 0 6px rgba(76,194,255,.55))}
.cd-num{font-size:78px;font-weight:600;color:#fff;letter-spacing:-2px;line-height:1}
@keyframes cd-in{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cd-sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:295}}
@keyframes cd-pop{0%{transform:scale(.55);opacity:0}35%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<div id="drop">
  <div class="drop-card">
    <h1>Easy Slideshow</h1>
    <p>Drop a folder or hundreds of images here to play them as a fast slideshow</p>

<div id="app">
  <!-- Title bar -->

    <div class="tb-left">

    <div class="tb-title" id="fileName">Image</div>

    <div class="tb-right">
      <button class="tb-btn openwith" id="openWithBtn" title="Open with">
        Open with
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8l4 4 4-4"/></svg>
      </button>
      <div class="caption">
        <button class="min" id="minBtn" title="Minimize"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 10h12"/></svg></button>
        <button class="close" id="closeBtn" title="Close"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 4l12 12M16 4L4 16"/></svg></button>

    </div>
  </header>

  <!-- Stage -->
  <div id="stage">
    <img id="image" draggable="false" alt="">
    <button class="nav prev" id="navPrev" title="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>

    <div id="strip"></div>
    <div id="countdown">
      <div class="cd-ring">
        <svg viewBox="0 0 100 100"><circle class="cd-track" cx="50" cy="50" r="47"/><circle class="cd-prog" cx="50" cy="50" r="47"/></svg>

  <!-- Status bar -->
  <footer id="statusbar">
    <div class="sb-group sb-left">
      <button class="sb-btn" id="filmBtn" title="Filmstrip">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="15" height="9" rx="1.2"/><path d="M6.5 5.5v9M13.5 5.5v9"/></svg>
      </button>
      <button class="sb-btn" id="play" title="Slideshow (Space)">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="1.6"/><path d="M8.3 7.4l4 2.6-4 2.6z" fill="currentColor" stroke="none"/></svg>
      </button>

    <div class="sb-group sb-center">

<script>
(() => {
  const $ = id => document.getElementById(id);
  const drop=$('drop'), app=$('app'), image=$('image');
  const play=$('play'), navPrev=$('navPrev'), navNext=$('navNext'), duration=$('duration');
  const durationText=$('durationText'), durationInput=$('durationInput');
  const fileName=$('fileName'), strip=$('strip');
  const countdown=$('countdown'), countdownNum=countdown.querySelector('.cd-num');
  const countdownProg=countdown.querySelector('.cd-prog'), stage=$('stage');

  let files=[], index=0, playing=false, timer=null, currentUrl=null, countdownTimer=null, rot=0;
  const cache=new Map();

  function imageFile(f){return f.type.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|avif|bmp|tif|tiff)$/i.test(f.name)}

  function format(ms){return ms>=1000 ? (ms/1000).toFixed(2).replace(/\.?0+$/,'')+' s' : ms+' ms'}

  function setDurationLabel(v){
    durationText.firstChild.nodeValue=format(v)+' ';
  }
  function setDuration(v){
    v=Math.max(1,Math.min(60000,Number(v)||200));
    duration.value=Math.min(1000,Math.max(50,v));
    setDurationLabel(v);
    durationInput.value=v;
    if(playing){clearTimeout(timer); schedule();}
  }

  function makeThumb(i){
    const t=document.createElement('img');
    t.className='thumb';
    t.src=URL.createObjectURL(files[i]);
    t.dataset.index=i;
    t.title=files[i].name;
    t.onclick=()=>{cancelCountdown();stop();display(i)};
    t.onload=()=>URL.revokeObjectURL(t.src);
    return t;
  }

  function buildStrip(){
    strip.innerHTML='';
    const frag=document.createDocumentFragment();
    files.forEach((_,i)=>frag.appendChild(makeThumb(i)));
    strip.appendChild(frag);
  }

  function preloadAround(c){
    for(let d=1;d<=5;d++){
      const i=c+d;
      if(i>=files.length || cache.has(i))continue;
      const url=URL.createObjectURL(files[i]), im=new Image();
      im.src=url; cache.set(i,{url,im});
    }
    for(const [i,x] of cache){
      if(i<c-1 || i>c+5){URL.revokeObjectURL(x.url);cache.delete(i)}
    }
  }

  function applyRotation(){
    let scale=1;
    if((rot%180)!==0 && image.naturalWidth){
      const W=stage.clientWidth, H=stage.clientHeight;
      const r=Math.min(W/image.naturalWidth, H/image.naturalHeight);
      const dispW=image.naturalWidth*r, dispH=image.naturalHeight*r;
      scale=Math.min(W/dispH, H/dispW, 1);
    }
    image.style.transform=`rotate(${rot}deg) scale(${scale})`;
  }

  function display(i){
    if(!files.length)return;
    index=(i+files.length)%files.length;
    rot=0;
    if(currentUrl)URL.revokeObjectURL(currentUrl);
    const cached=cache.get(index);
    if(cached){currentUrl=cached.url;cache.delete(index)}
    else currentUrl=URL.createObjectURL(files[index]);
    image.style.transform='';
    image.src=currentUrl;
    fileName.textContent=files[index].name;
    document.title=files[index].name+' — Easy Slideshow';
    [...strip.children].forEach((x,j)=>x.classList.toggle('current',j===index));
    const thumb=strip.children[index];
    if(thumb)thumb.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'});
    preloadAround(index);
  }

  image.addEventListener('load',applyRotation);
  window.addEventListener('resize',applyRotation);

  function schedule(){
    timer=setTimeout(()=>{if(!playing)return;display(index+1);schedule()},Number(durationInput.value));
  }
  function start(){
    if(playing||files.length<2)return;
    playing=true;setPlayIcon(true);schedule();
  }
  function stop(){playing=false;setPlayIcon(false);clearTimeout(timer);timer=null}
  function toggle(){cancelCountdown();playing?stop():start()}
  function setPlayIcon(on){
    play.innerHTML = on
      ? '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="1.6"/><path d="M8 7.5v5M12 7.5v5" stroke-width="1.6"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="1.6"/><path d="M8.3 7.4l4 2.6-4 2.6z" fill="currentColor" stroke="none"/></svg>';
    play.title = on ? 'Pause (Space)' : 'Slideshow (Space)';
  }

  function cancelCountdown(){
    if(countdownTimer){clearTimeout(countdownTimer);countdownTimer=null}
    countdown.style.display='none';
  }

  function runCountdown(n,done){
    cancelCountdown();
    countdown.style.display='grid';
    const tick=k=>{
      if(k<=0){countdown.style.display='none';countdownTimer=null;done();return}
      countdownNum.textContent=k;
      countdownNum.style.animation='none';countdownProg.style.animation='none';
      countdownNum.offsetHeight;
      countdownNum.style.animation='cd-pop .45s ease-out';
      countdownProg.style.animation='cd-sweep 1s linear forwards';
      countdownTimer=setTimeout(()=>tick(k-1),1000);
    };
    tick(n);
  }

  function goHome(){
    cancelCountdown();stop();
    if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}
    cache.forEach(x=>URL.revokeObjectURL(x.url));cache.clear();
    files=[];index=0;
    app.style.display='none';drop.style.display='grid';
    document.title='Easy Slideshow – Fast In-Browser Image Slideshow Viewer';
  }

  function load(list){
    const selected=[...list].filter(imageFile);
    if(!selected.length)return;
    cancelCountdown();stop();
    files=selected;index=0;
    cache.forEach(x=>URL.revokeObjectURL(x.url));cache.clear();
    drop.style.display='none';app.style.display='grid';
    strip.style.display='flex';app.classList.remove('no-strip');
    buildStrip();display(0);
    if(files.length>1)runCountdown(3,start);
  }

  // Speed slider / label
  duration.addEventListener('input',()=>setDuration(Number(duration.value)));
  durationText.onclick=()=>{
    durationText.style.display='none';durationInput.style.display='block';
    durationInput.focus();durationInput.select();
  };
  function finishInput(){
    setDuration(durationInput.value);
    durationInput.style.display='none';durationText.style.display='inline-flex';
  }
  durationInput.addEventListener('blur',finishInput);
  durationInput.addEventListener('keydown',e=>{
    if(e.key==='Enter')finishInput();
    if(e.key==='Escape'){durationInput.value=Number(durationText.textContent.match(/[\d.]+/)[0]);finishInput()}
  });
  $('slowBtn').onclick=()=>setDuration(Number(durationInput.value)+50);
  $('fastBtn').onclick=()=>setDuration(Number(durationInput.value)-50);

  // Playback + navigation
  play.onclick=toggle;
  navPrev.onclick=()=>{cancelCountdown();stop();display(index-1)};
  navNext.onclick=()=>{cancelCountdown();stop();display(index+1)};

  // Title-bar actions
  $('rotateBtn').onclick=()=>{rot=(rot+90)%360;applyRotation()};
  $('fitBtn').onclick=()=>{rot=0;applyRotation()};
  $('deleteBtn').onclick=()=>{
    if(!files.length)return;
    cache.forEach(x=>URL.revokeObjectURL(x.url));cache.clear();
    files.splice(index,1);
    if(!files.length){goHome();return}
    buildStrip();display(index % files.length);
  };
  $('closeBtn').onclick=goHome;

  // Status-bar toggles
  $('filmBtn').onclick=()=>app.classList.toggle('no-strip');
  $('fullBtn').onclick=()=>{
    if(document.fullscreenElement)document.exitFullscreen();
    else (document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen());
  };

  // Drop / picker
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');load(e.dataTransfer.files)});
  drop.addEventListener('click',()=>{
    const input=document.createElement('input');
    input.type='file';input.multiple=true;input.accept='image/*';
    input.onchange=()=>load(input.files);input.click();
  });

  document.addEventListener('keydown',e=>{
    if(!files.length)return;
    if(e.code==='Space'){e.preventDefault();toggle()}
    else if(e.key==='ArrowRight'){cancelCountdown();stop();display(index+1)}
    else if(e.key==='ArrowLeft'){cancelCountdown();stop();display(index-1)}
    else if(e.key==='Escape')goHome();
  });

  window.addEventListener('beforeunload',()=>{
    if(currentUrl)URL.revokeObjectURL(currentUrl);
    cache.forEach(x=>URL.revokeObjectURL(x.url));
  });
})();
</script>
</body>
</html>
